<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Agentrix: Upgrade your website into WebAgents</title>
<desc id="d">An infected old website passes through a sealed room on Vultr and comes out as a clean new site that answers visitors and goes live only on the owner's passkey.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&amp;family=DM+Sans:wght@400;700&amp;display=swap');
.d { font-family: Manrope, 'DM Sans', Helvetica, Arial, sans-serif; }
.t { font-family: 'DM Sans', Helvetica, Arial, sans-serif; }
</style>
<defs>
<radialGradient id="bg" cx="78%" cy="40%" r="75%">
<stop offset="0" stop-color="#2f2b62"/>
<stop offset="1" stop-color="#1f1d3d"/>
</radialGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a9a6d6"/></marker>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>

<!-- left: the message -->
<text x="128" y="250" class="t" font-size="26" font-weight="700" letter-spacing="4" fill="#ff8fa6">AGENTRIX · VULTR AGENT RUSH · CHALLENGE 1</text>
<text class="d" font-size="112" font-weight="800" letter-spacing="-2" fill="#f3f2fb">
<tspan x="122" y="400">Upgrade your</tspan>
<tspan x="122" y="520">website into</tspan>
<tspan x="122" y="640">WebAgents.</tspan>
</text>
<text class="t" font-size="34" fill="#c9c7e6">
<tspan x="128" y="735">We move small-business websites through sealed</tspan>
<tspan x="128" y="781">rooms on Vultr. The hack stays behind, and the</tspan>
<tspan x="128" y="827">new site goes live only on the owner’s passkey.</tspan>
</text>
<text x="128" y="950" class="t" font-size="24" fill="#a9a6d6">Zavora Technologies · built in Rust on adk-rust · runs on Vultr · MIT</text>

<!-- right 1: the old, infected site -->
<rect x="1180" y="150" width="560" height="230" rx="18" fill="#2c2a57" stroke="#6f6ba8" stroke-width="2"/>
<path d="M1180,190 V168 a18,18 0 0 1 18,-18 H1722 a18,18 0 0 1 18,18 V190 Z" fill="#38356d"/>
<circle cx="1206" cy="170" r="6" fill="#6f6ba8"/><circle cx="1228" cy="170" r="6" fill="#6f6ba8"/><circle cx="1250" cy="170" r="6" fill="#6f6ba8"/>
<text x="1278" y="177" class="t" font-size="20" fill="#a9a6d6">old WordPress site</text>
<rect x="1206" y="212" width="400" height="12" rx="6" fill="#4a4790"/>
<rect x="1206" y="238" width="330" height="12" rx="6" fill="#4a4790"/>
<rect x="1206" y="264" width="370" height="12" rx="6" fill="#4a4790"/>
<rect x="1206" y="314" width="140" height="40" rx="20" fill="none" stroke="#ff8fa6" stroke-width="2"/>
<text x="1276" y="341" text-anchor="middle" class="t" font-size="20" fill="#ff8fa6">spam links</text>
<rect x="1360" y="314" width="126" height="40" rx="20" fill="none" stroke="#ff8fa6" stroke-width="2"/>
<text x="1423" y="341" text-anchor="middle" class="t" font-size="20" fill="#ff8fa6">webshell</text>
<rect x="1500" y="314" width="160" height="40" rx="20" fill="none" stroke="#ff8fa6" stroke-width="2"/>
<text x="1580" y="341" text-anchor="middle" class="t" font-size="20" fill="#ff8fa6">hidden script</text>

<line x1="1460" y1="392" x2="1460" y2="436" stroke="#a9a6d6" stroke-width="3" marker-end="url(#ah)"/>

<!-- right 2: the sealed room -->
<rect x="1180" y="450" width="560" height="170" rx="22" fill="#28234a" stroke="#f2c46d" stroke-width="3" stroke-dasharray="12 8"/>
<text x="1212" y="494" class="t" font-size="22" font-weight="700" letter-spacing="3" fill="#f2c46d">SEALED ROOM · VULTR VX1</text>
<text x="1212" y="546" class="d" font-size="32" font-weight="700" fill="#f3f2fb">replay · clean · rebuild · prove</text>
<text x="1212" y="592" class="t" font-size="22" fill="#c9c7e6">no keys · no route out · destroyed after</text>

<line x1="1460" y1="632" x2="1460" y2="676" stroke="#a9a6d6" stroke-width="3" marker-end="url(#ah)"/>

<!-- right 3: the new site -->
<rect x="1180" y="690" width="560" height="250" rx="18" fill="#f6f6fa"/>
<path d="M1180,730 V708 a18,18 0 0 1 18,-18 H1722 a18,18 0 0 1 18,18 V730 Z" fill="#ecebf6"/>
<circle cx="1206" cy="710" r="6" fill="#cfcedd"/><circle cx="1228" cy="710" r="6" fill="#cfcedd"/><circle cx="1250" cy="710" r="6" fill="#cfcedd"/>
<text x="1278" y="717" class="t" font-size="20" fill="#656479">new signed site</text>
<rect x="1206" y="756" width="190" height="18" rx="9" fill="#38356d"/>
<rect x="1206" y="790" width="180" height="12" rx="6" fill="#cfcedd"/>
<rect x="1206" y="814" width="150" height="12" rx="6" fill="#cfcedd"/>
<rect x="1420" y="752" width="296" height="80" rx="18" fill="#38356d"/>
<text x="1442" y="786" class="t" font-size="22" font-weight="700" fill="#f3f2fb">Ask this site</text>
<text x="1442" y="815" class="t" font-size="20" fill="#d9d7f0">answers with citations</text>
<rect x="1206" y="864" width="318" height="50" rx="25" fill="#b72d50"/>
<text x="1365" y="896" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#fbfbfd">Approve with passkey</text>
<rect x="1540" y="864" width="176" height="50" rx="25" fill="#ecebf6" stroke="#38356d" stroke-width="2"/>
<text x="1628" y="896" text-anchor="middle" class="t" font-size="22" fill="#38356d">agent door</text>
</svg>
