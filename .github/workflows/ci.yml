name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml (1.95.0 with clippy and rustfmt).
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked
      # Words on screen (specs/platform/voice.md): the lint's own tests, then the lint.
      - name: copy lint
        run: python3 scripts/tests/test_copy_lint.py && scripts/copy-lint
