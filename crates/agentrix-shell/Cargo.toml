[package]
name = "agentrix-shell"
description = "The owner console as Agentrix OS: status bar, dock, worlds, lane, command bar, Day Time and Night Time, Freeze, and the pages inside the shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# W5 (owner console) owns this crate. Pages read through `ShellPort`; `ControlPort` implements it
# over control.db and agentrix-host's NodeContext. The shell's own tables (quiet hours, Freeze,
# last visit) are migrations/05xx, run by `agentrix_shell::migrate`.

[features]
# Read templates from disk on every render, for editing markup without rebuilding. Never in release.
dev-reload = []

[dependencies]
agentrix-console.workspace = true
agentrix-decisions.workspace = true
agentrix-host.workspace = true
agentrix-kernel.workspace = true
agentrix-store.workspace = true
agentrix-types.workspace = true
agentrix-ui.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
minijinja.workspace = true
minijinja-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[build-dependencies]
minijinja-embed.workspace = true

[dev-dependencies]
tokio.workspace = true
tower.workspace = true

[lints]
workspace = true
