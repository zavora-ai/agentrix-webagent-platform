<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agentrix film</title>
<!-- The home page film: a split screen, the shop on the left and its website on the right,
     the same Saturday twice. Every frame is a function of the time t (seek), so render.py
     draws it frame by frame. ?film=film or ?film=loop picks the timeline; ?play plays it here.
     Left: photoreal stills from W11 (stills/lNN.webp), fictional people made with AI, labelled.
     Right: captures of the real product (right/*.webp, capture.py) and panels drawn here for
     the old WordPress site, Telegram, reviews, the prep list (coming next) and two stores. -->
<style>
@font-face { font-family: "Manrope"; font-weight: 200 800; src: url(../../agentrix-ui/static/fonts/manrope-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "DM Sans"; font-weight: 100 1000; src: url(../../agentrix-ui/static/fonts/dm-sans-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "Fraunces"; font-weight: 100 900; src: url(../../agentrix-ui/static/fonts/fraunces-latin-opsz-normal.woff2) format("woff2-variations"); }
* { box-sizing: border-box; margin: 0; }
html, body { background: #0b0a16; }
body { width: 1920px; height: 1080px; overflow: hidden; font-family: "DM Sans", system-ui, sans-serif; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0a16; }
.half { position: absolute; top: 0; height: 1080px; width: 958px; overflow: hidden; isolation: isolate; z-index: 0; }
#left { left: 0; } #right { left: 962px; background: #f6f6fa; }
.layer { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
.layer img { width: 100%; height: 100%; object-fit: cover; display: block; }
img.still { width: 100%; height: 100%; object-fit: cover; }
#grade { position: absolute; left: 0; top: 0; width: 958px; height: 1080px; pointer-events: none; mix-blend-mode: soft-light; }
.before #grade { background: rgba(60, 90, 170, .35); }
.after #grade, .move #grade { background: rgba(255, 170, 80, .28); }
.before #left .layer { filter: saturate(.72) brightness(.94) contrast(1.04); }
.after #left .layer, .move #left .layer { filter: saturate(1.08) brightness(1.02); }
#vignette { position: absolute; left: 0; top: 0; width: 958px; height: 1080px; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.35)); pointer-events: none; }
#divider { position: absolute; left: 958px; top: 0; width: 4px; height: 1080px; background: #2c2a57; }
.after #divider, .move #divider { background: #de4060; }
.chip { position: absolute; display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; font: 700 22px "DM Sans", sans-serif; letter-spacing: .02em; backdrop-filter: blur(8px); }
#clock { left: 32px; top: 32px; background: rgba(10, 9, 22, .62); color: #fff; }
#clock i { width: 10px; height: 10px; border-radius: 50%; background: #f2c46a; display: inline-block; }
.before #clock i { background: #8e8da3; }
#where { left: 34px; top: 92px; font: 600 18px "DM Sans", sans-serif; color: rgba(255,255,255,.86); text-shadow: 0 1px 8px rgba(0,0,0,.5); position: absolute; }
#rlabel { right: 28px; top: 28px; background: rgba(31, 29, 61, .86); color: #fff; font-size: 18px; padding: 8px 16px; }
.after #rlabel, .move #rlabel { background: #b72d50; }
#ailabel { position: absolute; left: 30px; bottom: 22px; z-index: 2; padding: 5px 12px; border-radius: 8px; background: rgba(10, 9, 22, .55); font: 600 16px "DM Sans", sans-serif; color: rgba(255,255,255,.9); }
#capwrap { position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(transparent, rgba(5, 4, 14, .78)); pointer-events: none; }

/* The hero plays at a third of this size: bigger words, and the AI label moves into the page's own text. */

<div id="stage" class="before">

  <div id="right" class="half"></div>
  <div id="grade"></div>

  <div id="ailabel"></div>
  <div id="capwrap"></div>
  <div id="cap"></div>
  <div id="title"></div>
  <div id="end">
    <div>
      <div class="logo"><svg width="48" height="48" viewBox="0 0 26 26"><clipPath id="lc"><rect width="26" height="26" rx="8"/></clipPath><g clip-path="url(#lc)"><rect width="26" height="26" fill="#38356d"/><path d="M13 13 27.86-.38A20 20 0 0 1 3 30.32Z" fill="#de4060"/></g><rect x="7" y="7" width="12" height="12" rx="4" fill="#fff"/></svg>Agentrix</div>
      <h1>Upgrade your website<br>into <span>WebAgents.</span></h1>
      <div class="box">your-business.example<b>Show me</b></div>
      <p class="sub">Free check-up at agentrix.website</p>
    </div>
    <p class="small" id="endsmall"></p>
  </div>
</div>

<script>
// ?f=<film> picks films/<film>.js (kilele by default); it must load before the engine below.
document.write(`<script src="films/${(new URLSearchParams(location.search).get("f") || "kilele").replace(/[^a-z0-9-]/g, "")}.js"><\/script>`);
</script>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const $ = (s, r = document) => r.querySelector(s);
// The film, from films/<f>.js (window.FILMDEF): its timelines, stills, captured images,
// drawn panels and words. Times in seconds.
const F = window.FILMDEF;
document.title = F.title;
$("#ailabel").textContent = `People made with AI. ${F.sample}`;
$("#endsmall").textContent = `${F.sample} People made with AI. WebAgents are AI, and say so.`;
const num = k => parseInt(k.replace(/\D/g, ""), 10) || 1;

// "hero" is the home page's silent loop (the film's own, or the loop without its end card).
const TIMELINE = { loop: F.loop, hero: F.hero || (F.loop || []).slice(0, 2) }[q.get("film")] || F.film;
if (q.get("film") === "hero") document.documentElement.classList.add("hero-cut");
const DURATION = TIMELINE[TIMELINE.length - 1].at + TIMELINE[TIMELINE.length - 1].len;
const stage = $("#stage"), left = $("#left"), right = $("#right");
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const fmt = n => Math.round(n).toLocaleString("en");

const NIGHT = new Set(F.night || []);

// Layers, built once so nothing reloads between frames.
const layers = { left: {}, right: {} };
function addLayer(side, key, el) { const d = document.createElement("div"); d.className = "layer"; d.append(el); (side === "left" ? left : right).append(d); layers[side][key] = d; return d; }
const stills = Object.keys(F.shots).map(k => {
  const img = new Image(); img.className = "still"; img.alt = "";
  const ph = document.createElement("div"); ph.className = "ph"; ph.innerHTML = `${F.shots[k]}<small>Still ${num(k)} · coming from W11</small>`;
  ph.style.background = `linear-gradient(135deg, hsl(${(num(k) * 37) % 360} 30% 22%), #1f1d3d)`;
  const wrap = document.createElement("div"); wrap.style.cssText = "width:100%;height:100%"; wrap.append(img);
  // Stills drawn brighter than their hour: pulled down so night reads as night.
  if (NIGHT.has(k)) wrap.style.filter = "brightness(.58) saturate(.86) contrast(1.08)";
  // Tries each source in turn; settles once one loads or all fail (then the placeholder shows).
  img.settled = new Promise(done => {
    const sources = F.stills(k);
    img.onload = () => done(true);
    img.onerror = () => { if (sources.length) img.src = sources.shift(); else { img.remove(); wrap.append(ph); done(false); } };
    img.src = sources.shift();
  });
  addLayer("left", k, wrap); return img;
});
for (const [k, src] of Object.entries(F.images || {})) { const img = new Image(); img.alt = ""; img.src = src; addLayer("right", k, img); }
for (const [k, html] of Object.entries(F.templates || {})) { const t = document.createElement("template"); t.innerHTML = html.trim(); addLayer("right", k, t.content.firstElementChild); }

// The old WordPress dashboard (template "wp"): counts climb and the lists fill as they do.
const wp = layers.right.wp;
const orderTable = wp && $("[data-list=orders]", wp), msgBox = wp && $("[data-list=msgs]", wp);
function drawWp(r, x) {
  const { orders: ORDERS, msgs: MSGS } = F.wp;
  const v = lerp(r.visits[0], r.visits[1], x), o = Math.round(lerp(r.orders[0], r.orders[1], x)), m = Math.round(lerp(r.msgs[0], r.msgs[1], x));
  wp.querySelectorAll("[data-n=visits]").forEach(e => e.textContent = fmt(v));
  wp.querySelectorAll("[data-n=orders]").forEach(e => e.textContent = o);
  wp.querySelectorAll("[data-n=msgs]").forEach(e => e.textContent = m);
  $("[data-alarm]", wp).style.display = o + m > 0 ? "" : "none";
  orderTable.innerHTML = ORDERS.slice(0, Math.max(o, 2)).reverse().slice(0, 6).map(([id, who, what, at], i) => `<tr class="${i < o ? "unread" : ""}"><td>${id}</td><td>${who}</td><td>${what}</td><td>${at}</td><td class="status">Processing</td></tr>`).join("");
  msgBox.innerHTML = "<h3>Contact form</h3>" + MSGS.slice(0, Math.max(m, 1)).reverse().slice(0, 4).map(([t, w]) => `<div class="${r.flash && t.includes(r.flash) ? "flash" : ""}"><b>${t}</b>${w} · not read</div>`).join("");
  $(".notice.red", wp).style.background = r.alarm ? "#fcf0f1" : "#fff";
}

// A drawn panel's own motion, local seconds into it: [data-at] parts rise in at their second,
// [data-from][data-to] numbers count across the panel's time (data-fmt="money" for KSh).
function animate(key, local, len) {
  const L = layers.right[key]; if (!L) return;
  L.querySelectorAll("[data-at]").forEach(m => {
    const y = ease((local - Number(m.dataset.at)) / 0.4);
    m.style.opacity = y; m.style.transform = `translateY(${lerp(16, 0, y)}px)`;
  });
  L.querySelectorAll("[data-from]").forEach(e => {
    const v = lerp(Number(e.dataset.from), Number(e.dataset.to), ease(local / Math.max(len - 1, 1)));
    e.textContent = fmt(v);
  });
}

function textAt(cap, local) {
  if (!cap) return "";
  if (typeof cap === "string") return cap;
  const hit = cap.find(([a, b]) => local >= a && local < b);
  return hit ? hit[2] : "";
}
function pick(spec, local) {
  if (typeof spec === "string") return { key: spec, from: 0, to: Infinity };
  return spec.find(s => local >= s.from && local < s.to) || spec[spec.length - 1];
}

// Draws the frame at time t (seconds).
function seek(t) {
  t = Math.max(0, Math.min(t, DURATION - 1e-3));
  const i = TIMELINE.findIndex(b => t >= b.at && t < b.at + b.len);
  const b = TIMELINE[i], local = t - b.at, prev = TIMELINE[i - 1];
  stage.className = b.mood;
  for (const side of ["left", "right"]) for (const k in layers[side]) { layers[side][k].style.opacity = 0; layers[side][k].style.zIndex = 0; }

  const fadeIn = ease(local / 0.6);
  let z = 1;
  const show = (side, key, opacity, transform, origin) => {
    const L = layers[side][key]; if (!L) return;
    L.style.zIndex = z++;
    L.style.opacity = Math.max(Number(L.style.opacity) || 0, opacity);
    L.style.transform = transform || ""; L.style.transformOrigin = origin || "50% 50%";
  };
  const kenburns = (seed, x) => `scale(${lerp(1.06, 1.16, x)}) translate(${lerp(seed % 2 ? -1.5 : 1.5, seed % 2 ? 1.5 : -1.5, x)}%, ${lerp(1, -1, x)}%)`;

  // Previous beat underneath, during the cross-fade.
  if (prev && !prev.end && local < 0.6) {
    const pl = pick(prev.left, prev.len - 0.01), pr = prev.right.kind === "seq" ? pick(prev.right.items, prev.len - 0.01).key : (prev.right.key || "wp");
    show("left", pl.key, 1, kenburns(num(pl.key), 1));
    show("right", pr, 1);
  }
  if (!b.end) {
    const lp = pick(b.left, local), lx = (local - lp.from) / Math.min(b.len, lp.to - lp.from);
    const lfade = lp.from > 0 ? ease((local - lp.from) / 0.5) : fadeIn;
    if (lp.from > 0) { const before = pick(b.left, lp.from - 0.01); show("left", before.key, 1, kenburns(num(before.key), 1)); }
    show("left", lp.key, lfade, kenburns(num(lp.key), lx));

    const r = b.right, x = local / b.len;
    if (r.kind === "wp") { drawWp(r, ease(x)); show("right", "wp", fadeIn); }
    else if (r.kind === "img") { show("right", r.key, fadeIn, `scale(${lerp(r.zoom[0], r.zoom[1], ease(x))})`, r.origin); }
    else if (r.kind === "tpl") { show("right", r.key, fadeIn, `translateY(${lerp(14, 0, ease(local / 0.8))}px)`); animate(r.key, local, b.len); }
    else if (r.kind === "seq") {
      const it = pick(r.items, local), ix = (local - it.from) / (it.to - it.from);
      if (it.from > 0) { const was = pick(r.items, it.from - 0.01); show("right", was.key, 1); }
      // Captured pages drift in slowly; drawn panels hold still and animate their own parts.
      const still = !(it.key in (F.images || {}));
      show("right", it.key, it.from > 0 ? ease((local - it.from) / 0.5) : fadeIn, still ? "" : `scale(${lerp(1, 1.05, ix)})`, "50% 30%");
      if (still) animate(it.key, local - it.from, it.to - it.from);
    }
    $("#clock span").textContent = b.clock;
    $("#where").textContent = (F.places || {})[lp.key] || F.where;
    const ritem = r.kind === "seq" ? pick(r.items, local) : r;
    $("#rlabel").textContent = ritem.label || r.label || (b.mood === "before" ? F.rlabel.before : F.rlabel.after);
  }
  // Captions fade in and out with each line.
  const text = textAt(b.cap, local);
  const span = typeof b.cap === "string" ? [0, b.len] : (b.cap || []).find(([a, c]) => local >= a && local < c) || [0, 0];
  const capAlpha = Math.min(ease((local - span[0] - 0.2) / 0.4), ease((span[1] - local) / 0.35));
  $("#cap").textContent = text; $("#cap").style.opacity = text ? capAlpha : 0;
  $("#capwrap").style.opacity = b.end ? 0 : 1;
  $("#title").textContent = b.title || "";
  $("#title").style.opacity = b.title ? Math.min(ease(local / 0.4), ease((2.2 - local) / 0.5)) : 0;
  for (const id of ["#clock", "#where", "#rlabel", "#ailabel", "#divider"]) $(id).style.opacity = b.end ? 0 : 1;
  $("#end").style.opacity = b.end ? ease(local / 0.7) : 0;
  return { t, beat: i };
}
window.seek = seek; window.DURATION = DURATION;
window.frame = t => { seek(t); return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => r(true)))); };
window.ready = Promise.all([document.fonts.ready, ...stills.map(im => im.settled), ...[...document.images].filter(im => !stills.includes(im)).map(im => im.complete ? 1 : new Promise(r => { im.addEventListener("load", r); im.addEventListener("error", r); }))]).then(() => new Promise(r => setTimeout(r, 50))).then(() => true);
seek(Number(q.get("t") || 0));
if (q.has("play")) { const t0 = performance.now(); const tick = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); }; tick(); }
</script>
