<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Zavora Cloud operator</title>
<link rel="stylesheet" href="{{ ui_base }}/tokens.css?v={{ ui_v }}">
<link rel="stylesheet" href="{{ ui_base }}/kit.css?v={{ ui_v }}">
<link rel="stylesheet" href="{{ ui_base }}/shell.css?v={{ ui_v }}">
<link rel="stylesheet" href="/ops-static/ops.css?v={{ asset_v }}">
<script src="/ops-static/signin.js?v={{ asset_v }}" defer></script>
</head>
<body>
<main class="ops-signin">
  <form class="card" id="signin" data-next="{{ next }}" novalidate>
    <span class="scope-tag op">Operator · Zavora Cloud</span>
    <h1>Sign in to the control plane</h1>
    <p>For Zavora's people. Use the passkey you use on agentrix.website; without one, your authenticator app.</p>
    <div class="field-row" id="email-row">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username webauthn" required>
    </div>
    <div class="field-row" id="code-row" hidden>
      <label for="code">Code from your authenticator app</label>
      <input id="code" name="code" class="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
    </div>
    <button class="btn btn-primary" id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert" hidden></div>
    <p class="signin-foot">Operator sessions last 12 hours and work only on this host. Every sign-in is written to the operator ledger.</p>
  </form>
</main>
</body>
</html>
