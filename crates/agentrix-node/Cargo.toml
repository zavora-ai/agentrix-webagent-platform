[package]
name = "agentrix-node"
description = "The single-node server: public pages, Assess, sign-in, the console, sites by Host, Ask, the agent door, the Move orchestrator and the broker client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Crate-root files (this manifest, lib.rs, main.rs, app.rs, state.rs) belong to the integration
# lead; each module folder belongs to the lane in specs/brick-1/design.md §3.0. Ask the
# coordinator for a dependency.

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentrix-node"
path = "src/main.rs"

