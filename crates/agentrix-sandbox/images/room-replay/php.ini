; room-replay: route PHP streams through the job's proxy, log every error, and keep a hostile
; site's code inside sane bounds. The room's caps are the real limits.
auto_prepend_file = /opt/replay/prepend.php
log_errors = On
error_log = /tmp/php-errors.log
display_errors = Off
memory_limit = 256M
max_execution_time = 30
allow_url_include = Off
session.save_path = /tmp
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
