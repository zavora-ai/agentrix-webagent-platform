<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f3f3f8;">
{% if preheader %}
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f3f3f8;font-size:1px;line-height:1px;">{{ preheader }}</div>
{% endif %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f3f8;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
{% if sample_band %}
<tr><td style="padding:10px 16px;background:#fff4dd;border:1px solid #f1d9a6;border-bottom:0;border-radius:12px 12px 0 0;font-family:'DM Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45;font-weight:600;color:#8a5300;">{{ sample_band }}</td></tr>
{% endif %}
<tr><td style="background:#ffffff;border:1px solid #e3e2ec;{% if sample_band %}border-radius:0 0 18px 18px;{% else %}border-radius:18px;{% endif %}padding:24px 28px 12px;">
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px;">
<tr>
<td style="width:28px;height:28px;border-radius:9px;background:{{ accent }};" aria-hidden="true">&nbsp;</td>
<td style="padding-left:10px;font-family:Manrope,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.2;font-weight:800;color:#1f1d3d;">{{ brand }}{% if brand_sub %}<br><span style="font-family:'DM Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:500;color:#656479;">{{ brand_sub }}</span>{% endif %}</td>
</tr>
</table>
{{ body }}
</td></tr>
<tr><td style="padding:16px 12px 0;">
{{ footer }}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
