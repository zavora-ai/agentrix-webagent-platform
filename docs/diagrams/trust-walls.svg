<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
<title id="t">The four walls</title><desc id="d">How untrusted input, agents, releases and effects are separated: action wall, site wall, release wall and owner wall.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38356d"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#de4060"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2620a"/></marker></defs>
<rect width="1280" height="640" fill="#ffffff"/>
<g font-family="Inter, 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1d1b33">
<text x="24" y="38" font-size="21" font-weight="800" fill="#38356d" text-anchor="start">Four walls · what a tricked WebAgent cannot do</text>
<text x="24" y="60" font-size="12" font-weight="400" fill="#5d5a78" text-anchor="start">A compromised WebAgent can waste a bounded budget or propose something a gate refuses. It cannot steal a key, publish, or touch another site.</text>
<text x="24" y="100" font-size="11" font-weight="700" fill="#5d5a78" text-anchor="start" letter-spacing="1.2">UNTRUSTED WORLD</text>
<rect x="24" y="112" width="190" height="78" rx="12" fill="#ffffff" stroke="#d8d5ea" stroke-width="1.6"/>
<text x="38" y="136" font-size="13.5" font-weight="700" fill="#1d1b33" text-anchor="start">Legacy site</text>
<text x="38" y="156" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">possibly compromised</text>
<rect x="24" y="210" width="190" height="78" rx="12" fill="#ffffff" stroke="#d8d5ea" stroke-width="1.6"/>
<text x="38" y="234" font-size="13.5" font-weight="700" fill="#1d1b33" text-anchor="start">Open web pages</text>
<text x="38" y="254" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">hidden instructions, redirects</text>
<rect x="24" y="308" width="190" height="78" rx="12" fill="#ffffff" stroke="#d8d5ea" stroke-width="1.6"/>
<text x="38" y="332" font-size="13.5" font-weight="700" fill="#1d1b33" text-anchor="start">Visitor messages</text>
<text x="38" y="352" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">and uploads</text>
<rect x="24" y="406" width="190" height="78" rx="12" fill="#ffffff" stroke="#d8d5ea" stroke-width="1.6"/>
<text x="38" y="430" font-size="13.5" font-weight="700" fill="#1d1b33" text-anchor="start">Model-written code</text>
<text x="38" y="450" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">and theme builds</text>
<rect x="240" y="84" width="210" height="500" rx="16" fill="#fffbf5" stroke="#c2620a" stroke-width="1.4" stroke-dasharray="8 5"/>
<text x="256" y="106" font-size="11" font-weight="700" fill="#c2620a" text-anchor="start" letter-spacing="1.2">1 · ACTION WALL</text>
<rect x="256" y="132" width="178" height="332" rx="12" fill="#fff7ed" stroke="#c2620a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="270" y="156" font-size="13.5" font-weight="700" fill="#c2620a" text-anchor="start">Sealed room</text>
<text x="270" y="176" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">no keys</text>
<text x="270" y="193" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">egress: allowlist only</text>
<text x="270" y="210" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">no private ranges</text>
<text x="270" y="227" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">no instance metadata</text>
<text x="270" y="244" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">caps: cpu · mem · pids</text>
<text x="270" y="261" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">time limit</text>
<text x="270" y="278" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">destroyed after</text>
<text x="270" y="295" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">signed receipt</text>
<text x="256" y="500" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">gVisor · microVM (VX1)</text>
<text x="256" y="518" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">· throwaway VM</text>
<path d="M214,151 H254" fill="none" stroke="#c2620a" stroke-width="1.6" marker-end="url(#aa)"/>
<path d="M214,249 H254" fill="none" stroke="#c2620a" stroke-width="1.6" marker-end="url(#aa)"/>
<path d="M214,347 H254" fill="none" stroke="#c2620a" stroke-width="1.6" marker-end="url(#aa)"/>
<path d="M214,445 H254" fill="none" stroke="#c2620a" stroke-width="1.6" marker-end="url(#aa)"/>
<rect x="476" y="84" width="340" height="500" rx="16" fill="#f6f5fb" stroke="#d8d5ea" stroke-width="1.2"/>
<text x="492" y="106" font-size="11" font-weight="700" fill="#5d5a78" text-anchor="start" letter-spacing="1.2">2 · SITE WALL</text>
<rect x="492" y="120" width="308" height="200" rx="12" fill="#ffffff" stroke="#38356d" stroke-width="1.6"/>
<text x="506" y="144" font-size="13.5" font-weight="700" fill="#38356d" text-anchor="start">Kilele Bakery · TenantKernel</text>
<text x="506" y="164" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">own budget · own inference subscription</text>
<text x="506" y="181" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">own keys namespace · RLS on site_id</text>
<rect x="506" y="186" width="117.39999999999999" height="22" rx="11" fill="#f1f0fa" stroke="#38356d" stroke-width="1"/>
<text x="564.7" y="201" font-size="11" font-weight="600" fill="#38356d" text-anchor="middle">Chief WebAgent</text>
<rect x="629.4" y="186" width="81.9" height="22" rx="11" fill="#f1f0fa" stroke="#38356d" stroke-width="1"/>
<text x="670.35" y="201" font-size="11" font-weight="600" fill="#38356d" text-anchor="middle">Concierge</text>
<rect x="717.3" y="186" width="53.5" height="22" rx="11" fill="#f1f0fa" stroke="#38356d" stroke-width="1"/>
<text x="744.05" y="201" font-size="11" font-weight="600" fill="#38356d" text-anchor="middle">Sales</text>
<rect x="506" y="216" width="60.599999999999994" height="22" rx="11" fill="#f1f0fa" stroke="#38356d" stroke-width="1"/>
<text x="536.3" y="231" font-size="11" font-weight="600" fill="#38356d" text-anchor="middle">Editor</text>
<rect x="572.6" y="216" width="67.69999999999999" height="22" rx="11" fill="#f1f0fa" stroke="#38356d" stroke-width="1"/>
<text x="606.45" y="231" font-size="11" font-weight="600" fill="#38356d" text-anchor="middle">Cashier</text>
<rect x="646.3" y="216" width="74.8" height="22" rx="11" fill="#f1f0fa" stroke="#38356d" stroke-width="1"/>
<text x="683.6999999999999" y="231" font-size="11" font-weight="600" fill="#38356d" text-anchor="middle">Guardian</text>
<text x="506" y="270" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">reads sanitised, screened data only</text>
<text x="506" y="288" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">proposes; never publishes or pays</text>
<line x1="492" y1="346" x2="800" y2="346" stroke="#de4060" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="646" y="340" font-size="11" font-weight="600" fill="#de4060" text-anchor="middle">no reads, spends or approvals across</text>
<rect x="492" y="360" width="308" height="110" rx="12" fill="#f6f5fb" stroke="#d8d5ea" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="506" y="384" font-size="13.5" font-weight="700" fill="#1d1b33" text-anchor="start">Another business · TenantKernel</text>
<text x="506" y="404" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">isolated by construction</text>
<text x="506" y="421" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">cross-site request → denied + audited</text>
<path d="M434,282 H490" fill="none" stroke="#c2620a" stroke-width="1.6" marker-end="url(#aa)"/>
<rect x="427.2" y="256" width="69.6" height="18" rx="9" fill="#ffffff" stroke="#d8d5ea" stroke-width="0.8"/>
<text x="462" y="269" font-size="10.5" font-weight="600" fill="#c2620a" text-anchor="middle">data only</text>
<rect x="842" y="84" width="180" height="236" rx="16" fill="#f6f5fb" stroke="#d8d5ea" stroke-width="1.2"/>
<text x="858" y="106" font-size="11" font-weight="700" fill="#5d5a78" text-anchor="start" letter-spacing="1.2">3 · RELEASE WALL</text>
<rect x="856" y="116" width="152" height="188" rx="12" fill="#ffffff" stroke="#38356d" stroke-width="1.6"/>
<text x="870" y="140" font-size="13.5" font-weight="700" fill="#38356d" text-anchor="start">LaunchGate</text>
<text x="870" y="160" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">approvals</text>
<text x="870" y="177" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">parity ≥ 0.95</text>
<text x="870" y="194" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">policy · scans</text>
<text x="870" y="211" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">Ed25519 signs</text>
<text x="870" y="228" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">atomic pointer</text>
<text x="870" y="245" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">1-tap rollback</text>
<rect x="1048" y="116" width="208" height="92" rx="12" fill="#ffffff" stroke="#38356d" stroke-width="1.6"/>
<text x="1062" y="140" font-size="13.5" font-weight="700" fill="#38356d" text-anchor="start">Edge</text>
<text x="1062" y="160" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">serves signed releases only</text>
<text x="1062" y="177" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">tamper is detectable by anyone</text>
<rect x="1048" y="226" width="208" height="70" rx="12" fill="#ffffff" stroke="#d8d5ea" stroke-width="1.6"/>
<text x="1062" y="250" font-size="13.5" font-weight="700" fill="#1d1b33" text-anchor="start">Visitors &amp; AI agents</text>
<text x="1062" y="270" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">same truth for both</text>
<path d="M800,200 H854" fill="none" stroke="#38356d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="792.2" y="174" width="69.6" height="18" rx="9" fill="#ffffff" stroke="#d8d5ea" stroke-width="0.8"/>
<text x="827" y="187" font-size="10.5" font-weight="600" fill="#38356d" text-anchor="middle">candidate</text>
<path d="M1008,160 H1046" fill="none" stroke="#38356d" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M1152,208 V224" fill="none" stroke="#38356d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="842" y="348" width="180" height="236" rx="16" fill="#f6f5fb" stroke="#d8d5ea" stroke-width="1.2"/>
<text x="858" y="370" font-size="11" font-weight="700" fill="#5d5a78" text-anchor="start" letter-spacing="1.2">4 · OWNER WALL</text>
<rect x="856" y="380" width="152" height="188" rx="12" fill="#fff1f3" stroke="#de4060" stroke-width="1.6"/>
<text x="870" y="404" font-size="13.5" font-weight="700" fill="#de4060" text-anchor="start">Signed approval</text>
<text x="870" y="424" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">passkey over the</text>
<text x="870" y="441" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">effect fingerprint</text>
<text x="870" y="458" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">standing rules</text>
<text x="870" y="475" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">budget caps</text>
<text x="870" y="492" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">freeze switch</text>
<text x="870" y="509" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">exactly once</text>
<rect x="1048" y="380" width="208" height="104" rx="12" fill="#fff1f3" stroke="#de4060" stroke-width="1.6"/>
<text x="1062" y="404" font-size="13.5" font-weight="700" fill="#de4060" text-anchor="start">Key holders</text>
<text x="1062" y="424" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">Model Gateway · Effects Gateway</text>
<text x="1062" y="441" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">the only places with secrets</text>
<text x="1062" y="458" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">agents hold capabilities</text>
<rect x="1048" y="504" width="208" height="70" rx="12" fill="#ffffff" stroke="#d8d5ea" stroke-width="1.6"/>
<text x="1062" y="528" font-size="13.5" font-weight="700" fill="#1d1b33" text-anchor="start">Providers</text>
<text x="1062" y="548" font-size="11.5" font-weight="400" fill="#5d5a78" text-anchor="start">payments · messages · DNS</text>
<path d="M800,296 H828 V452 H854" fill="none" stroke="#de4060" stroke-width="1.6" marker-end="url(#ac)"/>
<rect x="800.6" y="368" width="56.800000000000004" height="18" rx="9" fill="#ffffff" stroke="#d8d5ea" stroke-width="0.8"/>
<text x="829" y="381" font-size="10.5" font-weight="600" fill="#de4060" text-anchor="middle">effects</text>
<path d="M1008,440 H1046" fill="none" stroke="#de4060" stroke-width="1.6" marker-end="url(#ac)"/>
<path d="M1152,484 V502" fill="none" stroke="#de4060" stroke-width="1.6" marker-end="url(#ac)"/>
<text x="24" y="616" font-size="12" font-weight="400" fill="#5d5a78" text-anchor="start">Every crossing leaves a receipt in the site log: hash-chained, signed, and readable in plain words in the owner&#x27;s Trust tab.</text>
</g></svg>
