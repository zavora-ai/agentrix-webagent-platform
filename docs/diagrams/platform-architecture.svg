<text x="24" y="60" font-size="12" font-weight="400" fill="#5d5a78" text-anchor="start">One Rust workspace on adk-rust v3, running on Vultr. Blue = Vultr product · coral = holds secrets · amber dashed = sealed, untrusted work.</text>
